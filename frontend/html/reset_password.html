<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTasking - Nueva Contraseña</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">

    <div class="logo">
      <h1>MTasking</h1>
      <p>Establece tu nueva contraseña</p>
    </div>

    <div class="alert alert-error"   id="msg-error"></div>
    <div class="alert alert-success" id="msg-success"></div>

    <div class="form-group">
      <label for="input-password">Nueva contraseña</label>
      <input type="password" id="input-password" placeholder="Mínimo 6 caracteres" />
    </div>

    <div class="form-group">
      <label for="input-confirmar">Confirmar contraseña</label>
      <input type="password" id="input-confirmar" placeholder="Repite la contraseña" />
    </div>

    <button class="btn btn-primary" style="width:100%;" onclick="restablecerPassword()">
      Actualizar contraseña
    </button>

    <div style="text-align:center; margin-top:16px; font-size:0.85rem;">
      <a href="index.html" style="color:#3498db;">← Volver al inicio</a>
    </div>

  </div>
</div>

<script>
  const API = 'http://localhost:8083/mtasking/backend/index.php';
  const token = new URLSearchParams(window.location.search).get('token');

  // Si no hay token en la URL, mostrar error de inmediato
  if (!token) {
    document.getElementById('msg-error').textContent = 'Enlace inválido o expirado.';
    document.getElementById('msg-error').className   = 'alert alert-error show';
  }

  function showMsg(id, msg, type = 'error') {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = `alert alert-${type} show`;
  }

  async function restablecerPassword() {
    const password  = document.getElementById('input-password').value.trim();
    const confirmar = document.getElementById('input-confirmar').value.trim();

    if (!password || !confirmar) {
      showMsg('msg-error', 'Completa todos los campos.');
      return;
    }
    if (password !== confirmar) {
      showMsg('msg-error', 'Las contraseñas no coinciden.');
      return;
    }
    if (password.length < 6) {
      showMsg('msg-error', 'Mínimo 6 caracteres.');
      return;
    }

    try {
      const res  = await fetch(`${API}/auth/restablecer-password`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ token, password })
      });
      const data = await res.json();

      if (!res.ok) {
        showMsg('msg-error', data.error || 'Error al actualizar.');
        return;
      }

      showMsg('msg-success', data.message + ' Redirigiendo...', 'success');
      setTimeout(() => window.location.href = 'index.html', 2500);

    } catch (e) {
      showMsg('msg-error', 'No se pudo conectar con el servidor.');
    }
  }
</script>

</body>
</html>
