<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTasking - Recuperar Contraseña</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">

    <div class="logo">
      <h1>MTasking</h1>
      <p>Recuperar contraseña</p>
    </div>

    <div class="alert alert-error"   id="msg-error"></div>
    <div class="alert alert-success" id="msg-success"></div>

    <div class="form-group">
      <label for="input-email">Email registrado</label>
      <input type="email" id="input-email" placeholder="tu@email.com" />
    </div>

    <button class="btn btn-primary" style="width:100%;" onclick="solicitarReset()">
      Enviar enlace
    </button>

    <div style="text-align:center; margin-top:16px; font-size:0.85rem;">
      <a href="index.html" style="color:#3498db;">← Volver al inicio</a>
    </div>

  </div>
</div>

<script>
  const API = 'http://localhost:8083/mtasking/backend/index.php';

  function showMsg(id, msg, type = 'error') {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = `alert alert-${type} show`;
  }

  async function solicitarReset() {
    const email = document.getElementById('input-email').value.trim();

    if (!email) {
      showMsg('msg-error', 'Ingresa tu email.');
      return;
    }

    try {
      const res  = await fetch(`${API}/auth/solicitar-reset`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ email })
      });
      const text = await res.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch {
        console.error('Respuesta no JSON:', text);
        showMsg('msg-error', 'Error del servidor. Revisa que Apache esté activo en localhost:8083.');
        return;
      }

      if (!res.ok) {
        showMsg('msg-error', data.error || 'Error al procesar la solicitud.');
        return;
      }

      showMsg('msg-success', data.message, 'success');
      document.getElementById('input-email').value = '';

    } catch (e) {
      console.error(e);
      showMsg('msg-error', 'No se pudo conectar con el servidor. Verifica que XAMPP (Apache) esté encendido en el puerto 8083.');
    }
  }

  // Permitir Enter
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') solicitarReset();
  });
</script>

</body>
</html>
